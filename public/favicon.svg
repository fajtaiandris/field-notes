<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
      :root {
        --color-ink: #222226;
      }
        
      @media (prefers-color-scheme: dark) {
        :root {
          --color-ink: #a89b83;
        }
      }
      
  </style>
  <defs>
    <filter id="wear" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.011"
        numOctaves="3"
        result="texture"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="texture"
        scale="8"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>
  <rect x="7" y="7" width="50" height="50" fill="var(--color-ink)" filter="url(#wear)" />
</svg>
